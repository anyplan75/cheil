name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site files
        run: |
          mkdir -p _site
          cp index.html broadcast.html listen.html admin.html monitor.html overlay.html README.md _site/
          cp -r css js _site/
      # Do not use enablement:true — first-time Pages create needs repo admin.
      # Enable once in Settings → Pages (GitHub Actions or branch `pages` / root),
      # then this workflow can deploy.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
